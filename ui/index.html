<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Pip-Boy</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☢️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root { --g: #2bff88; --g2: #13a652; --g3: #0a4d27; --scr: #031a0b; --amber: #ffc23a; --red: #ff5b3b; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  .whipped, .whipped * { cursor: none !important; }
  #whip { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1000; }
  body { margin: 0; color: var(--g); overflow: hidden; padding: 14px;
    font: 19px/1.15 "VT323", "DejaVu Sans Mono", ui-monospace, Menlo, monospace;
    background: radial-gradient(ellipse at 50% 30%, #2a2c25, #0d0e0b 80%); }

  /* ── the device: olive plastic bezel, corner screws, plate, knob ── */
  .pip { position: relative; height: 100%; max-width: 1280px; margin: 0 auto; padding: 22px 26px 58px; border-radius: 36px;
    background:
      radial-gradient(circle at 20px 20px, #1a1b16 0 3px, #8b8e7e 4px 6px, transparent 7px),
      radial-gradient(circle at calc(100% - 20px) 20px, #1a1b16 0 3px, #8b8e7e 4px 6px, transparent 7px),
      radial-gradient(circle at 20px calc(100% - 20px), #1a1b16 0 3px, #8b8e7e 4px 6px, transparent 7px),
      radial-gradient(circle at calc(100% - 20px) calc(100% - 20px), #1a1b16 0 3px, #8b8e7e 4px 6px, transparent 7px),
      linear-gradient(160deg, #6a6d5e, #46483d 55%, #34362d);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.18), inset 0 -4px 0 rgba(0,0,0,.35), 0 20px 50px rgba(0,0,0,.7); }
  .plate { position: absolute; left: 34px; bottom: 16px; font-size: 18px; letter-spacing: .18em; color: #25271f;
    text-shadow: 0 1px 0 rgba(255,255,255,.22); }
  .knob { position: absolute; right: 44px; bottom: 7px; width: 44px; height: 44px; border-radius: 50%;
    background: radial-gradient(circle, #55584a 0 30%, transparent 31%), repeating-conic-gradient(#2b2d25 0 9deg, #7b7e6f 9deg 18deg);
    box-shadow: 0 3px 6px rgba(0,0,0,.6); }

  .screen { position: relative; height: 100%; display: grid; grid-template-rows: auto 1fr auto; gap: 10px; padding: 12px 18px 10px;
    background: radial-gradient(ellipse at center, #06301a 0%, var(--scr) 75%); border-radius: 26px / 22px; border: 6px solid #15160f;
    box-shadow: 0 0 0 3px #7a7d6d, inset 0 0 70px rgba(0,0,0,.85), inset 0 0 12px rgba(43,255,136,.25);
    text-shadow: 0 0 6px rgba(43,255,136,.55); overflow: hidden; }
  /* CRT: scanlines + vignette, a slow rolling bar, flicker */
  .screen::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 50; animation: flick 6s infinite;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.3) 0 1px, transparent 1px 3px),
                radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.75) 100%); }
  .screen::before { content: ""; position: absolute; left: 0; right: 0; height: 90px; z-index: 49; pointer-events: none;
    background: linear-gradient(transparent, rgba(43,255,136,.08), transparent); top: -90px; animation: roll 7s linear infinite; will-change: transform; }
  @keyframes roll { to { transform: translateY(calc(100vh + 90px)); } }   /* transform, not top: no relayout per frame */
  @keyframes flick { 0%, 100% { opacity: .96; } 47% { opacity: 1; } 50% { opacity: .85; } 53% { opacity: 1; } }
  @keyframes blink { 50% { opacity: 0; } }

  /* ── header: title row + Pip-Boy style tab row ── */
  header { display: grid; gap: 6px; }
  .ttl { display: flex; align-items: center; gap: 12px; }
  .vault { width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--g); display: grid; place-items: center; font-size: 18px;
    box-shadow: 0 0 0 3px var(--scr), 0 0 0 5px var(--g3), 0 0 10px rgba(43,255,136,.5); }
  .ttl b { font-size: 28px; font-weight: normal; letter-spacing: .12em; }
  #sub { color: var(--amber); text-shadow: 0 0 6px rgba(255,194,58,.5); margin-left: auto; }
  #err { color: var(--red); }
  #cur { background: none; border: 2px solid var(--g2); color: var(--g); font: inherit; text-shadow: inherit; padding: 0 8px; cursor: pointer; letter-spacing: .06em; }
  #cur:hover { border-color: var(--g); }
  #tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--g); overflow-x: auto; scrollbar-width: none; padding-top: 4px; }
  #tabs button, .sub button { background: none; border: 2px solid transparent; border-bottom: 0; margin-bottom: -2px; color: var(--g2);
    font: inherit; text-shadow: inherit; text-transform: uppercase; letter-spacing: .08em; padding: 0 14px; cursor: pointer; white-space: nowrap; }
  #tabs button:hover, .sub button:hover { color: var(--g); }
  #tabs button.on, .sub button.on { color: var(--g); border-color: var(--g); background: var(--scr); }
  #tabs button.on::before { content: "◂ "; } #tabs button.on::after { content: " ▸"; }
  #tabs .dot { animation: blink 1s steps(1) infinite; margin-left: 6px; color: var(--amber); }

  main { display: grid; grid-template-columns: 1fr 340px; gap: 12px; min-height: 0; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 220px; } .plate { display: none; } }

  /* ── office ── */
  #office { position: relative; min-height: 0; overflow: auto; padding: 18px; border: 2px solid var(--g2);
    background: linear-gradient(rgba(43,255,136,.08) 1px, transparent 1px) 0 0 / 32px 32px,
                linear-gradient(90deg, rgba(43,255,136,.08) 1px, transparent 1px) 0 0 / 32px 32px;
    display: grid; grid-template-columns: 220px 1fr; gap: 20px; align-items: start; scrollbar-width: thin; scrollbar-color: var(--g2) transparent; }
  @media (max-width: 600px) { #office { grid-template-columns: 1fr; } }
  #desks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 26px 14px; }

  .desk { position: relative; display: flex; flex-direction: column; align-items: center; padding-top: 70px; cursor: pointer; }
  .desk.boss { padding-top: 84px; cursor: default; color: var(--amber); text-shadow: 0 0 6px rgba(255,194,58,.5); }
  .bubble { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 160px; min-height: 52px; padding: 4px 8px; z-index: 2;
    background: rgba(1,13,6,.92); border: 1px solid currentColor; color: var(--g); font-size: 15px; box-shadow: 0 0 10px rgba(43,255,136,.2); }
  .cur { font-style: normal; margin-left: 3px; animation: blink 1s steps(1) infinite; }
  .bubble span { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .bubble:empty { display: none; }
  .bubble b { font-weight: normal; }
  .boss .bubble { width: 200px; color: var(--amber); }
  .stale .bubble { color: var(--red); text-shadow: 0 0 6px rgba(255,91,59,.5); }

  .bot { width: 72px; height: 84px; position: relative; z-index: 3; color: var(--g); }
  .boss .bot { width: 96px; height: 112px; color: var(--amber); }
  .bot svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 0 4px currentColor); }
  /* worker = power-armor helmet; PNG is a mask so currentColor tints it (green, red when stale/hit) */
  .helm { width: 100%; height: 100%; background: currentColor;
    -webkit-mask: url(/helm.png) center / contain no-repeat; mask: url(/helm.png) center / contain no-repeat; }
  .bot.hit { color: var(--red) !important; } .bot.hit .fig { animation: hit .6s ease-out !important; }
  @keyframes hit { 10% { transform: translate(-8px, 2px) rotate(-14deg) scale(.9); } 30% { transform: translate(7px, -3px) rotate(10deg); }
    50% { transform: translate(-4px, 0) rotate(-6deg); } 75% { transform: translate(2px, 0) rotate(3deg); } }
  .table { width: 120px; height: 16px; margin-top: -10px; position: relative; z-index: 4; border: 2px solid currentColor;
    background: rgba(43,255,136,.08); box-shadow: 0 0 8px rgba(43,255,136,.3); color: var(--g2); }
  .boss .table { width: 150px; color: var(--amber); background: rgba(255,194,58,.08); }
  .table::before { content: ""; position: absolute; left: 32px; top: -26px; width: 52px; height: 26px; border: 2px solid currentColor; background: var(--scr); }
  .working:not(.boss) .table { color: var(--g); }
  .working:not(.boss) .table::before { background: repeating-linear-gradient(0deg, var(--g) 0 2px, transparent 2px 5px);
    box-shadow: 0 0 12px rgba(43,255,136,.7); animation: scroll .5s linear infinite; }
  .boss .table::before { content: "☢"; border: 0; background: none; left: 104px; top: -22px; width: auto; height: auto; font-size: 20px; }
  .name { margin-top: 12px; padding: 0 10px; background: var(--g); color: var(--scr); text-shadow: none; letter-spacing: .08em; text-transform: uppercase; }
  .boss .name { background: var(--amber); }
  .meta { color: var(--g2); font-size: 14px; height: 16px; text-transform: uppercase; }

  /* bot parts */
  .eye { animation: blink-eye 4s infinite; transform-origin: center; transform-box: fill-box; }
  .bulb { animation: pulse 1.6s infinite; }
  .arm-l, .arm-r, .leg-l, .leg-r { transform-box: fill-box; transform-origin: top center; }
  .working .bot .fig { animation: bob .5s ease-in-out infinite; }
  .working .arm-l { animation: type .25s infinite alternate; }
  .working .arm-r { animation: type .25s .12s infinite alternate; }
  .walking .leg-l { animation: step .3s infinite alternate; }
  .walking .leg-r { animation: step .3s .15s infinite alternate-reverse; }
  .walking .bot .fig { animation: bob .3s infinite; }
  .cheer .bot .fig { animation: jump .5s ease-out 3; }
  .cheer .arm-l, .cheer .arm-r { transform: rotate(180deg); }
  .stale .bot { color: var(--g3); }
  .stale .bot svg { filter: none; }
  .idle .bot .fig { animation: breathe 3s ease-in-out infinite; }
  .zzz { position: absolute; top: 44px; right: 22px; font-weight: bold; display: none; z-index: 5; }
  .idle .zzz { display: block; animation: zzz 2.4s infinite; }
  .paper { position: absolute; top: 30px; left: -10px; font-size: 22px; display: none; z-index: 6; filter: grayscale(1) sepia(1) hue-rotate(60deg) saturate(4); }
  .carrying .paper { display: block; }
  /* Vault Boy mascot, bottom-left of the screen (gif has a transparent bg; no blend mode, those repaint every frame) */
  #vb { position: absolute; left: 22px; bottom: 44px; height: 140px; pointer-events: none; z-index: 40; }

  @keyframes blink-eye { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  @keyframes pulse { 50% { opacity: .35; } }
  @keyframes scroll { to { background-position-y: 5px; } }
  @keyframes bob { 50% { transform: translateY(-4px); } }
  @keyframes breathe { 50% { transform: translateY(2px) scale(1.01, .99); } }
  @keyframes type { from { transform: rotate(-25deg); } to { transform: rotate(-55deg); } }
  @keyframes step { from { transform: rotate(-22deg); } to { transform: rotate(22deg); } }
  @keyframes jump { 40% { transform: translateY(-22px); } }
  @keyframes zzz { 0% { opacity: 0; transform: translate(0, 6px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translate(10px, -14px); } }
  @keyframes pop { from { transform: translateX(-12px); opacity: 0; } }

  /* ── side panel: activity / terminal ── */
  aside { border: 2px solid var(--g2); padding: 6px 12px 10px; display: flex; flex-direction: column; min-height: 0; }
  .sub { display: flex; gap: 4px; border-bottom: 2px solid var(--g2); margin-bottom: 6px; padding-top: 2px; }
  #feed { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; scrollbar-width: thin; scrollbar-color: var(--g2) transparent; }
  #feed li { padding: 4px 0; border-bottom: 1px dashed var(--g3); font-size: 16px; overflow-wrap: anywhere; animation: pop .35s; }
  #feed time { color: var(--g2); margin-right: 6px; }
  #feed .tag { text-transform: uppercase; background: var(--g3); padding: 0 4px; }
  #feed .ov { color: var(--amber); }
  #term { display: none; flex: 1; min-height: 0; flex-direction: column; gap: 6px; }
  aside.term #term { display: flex; } aside.term #feed { display: none; }
  #pane { font: inherit; font-size: 16px; padding: 1px 6px; border: 1px solid var(--g2); background: var(--scr); color: var(--g); text-shadow: inherit; }
  #out { flex: 1; margin: 0; min-height: 0; overflow: auto; background: rgba(0,0,0,.45); border: 1px solid var(--g3); padding: 6px 8px;
    font: 13px/1.25 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; scrollbar-width: thin; scrollbar-color: var(--g2) transparent; }
  .empty { color: var(--g2); padding: 30px; text-align: center; grid-column: 1 / -1; }

  /* ── footer: stat bar like HP/AP ── */
  footer { display: flex; flex-wrap: wrap; gap: 4px 26px; align-items: center; border-top: 2px solid var(--g); padding-top: 6px; letter-spacing: .06em; }
  footer .a { color: var(--amber); } footer .r { color: var(--red); }
  .bar { display: inline-block; vertical-align: -2px; width: 150px; height: 14px; border: 2px solid var(--g); margin-left: 6px; }
  .bar i { display: block; height: 100%; width: var(--p, 0%); background: repeating-linear-gradient(90deg, var(--g) 0 7px, transparent 7px 10px); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>

<div class="pip">
  <div class="screen">
    <header>
      <div class="ttl"><div class="vault">101</div><b>STUDIO</b><span id="err"></span><span id="sub"></span><button id="cur" title="toggle whip cursor"></button></div>
      <nav id="tabs"></nav>
    </header>
    <main>
      <section id="office" aria-label="office">
        <div class="desk boss idle" id="boss">
          <div class="bubble"></div>
          <span class="zzz">z</span>
          <div class="bot"></div>
          <div class="table"></div>
          <div class="name">Claude · lead</div>
          <div class="meta"></div>
        </div>
        <div id="desks"></div>
      </section>
      <aside>
        <div class="sub"><button data-v="feed" class="on">Activity</button><button data-v="term">Terminal</button></div>
        <ul id="feed"></ul>
        <div id="term"><select id="pane"></select><pre id="out">select a worker…</pre></div>
      </aside>
    </main>
    <footer id="stats"></footer>
    <img id="vb" src="/vaultboy.gif" alt="">
  </div>
  <div class="plate">ROBCO · PIP-STUDIO 3000</div><div class="knob"></div>
</div>

<script>
// line-art Mr. Handy-ish bot: outlines in currentColor so CSS recolors it (green workers, amber overseer)
const botSvg = crown => `<svg viewBox="0 0 80 96" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="3" stroke-linejoin="round" class="fig">
  ${crown ? '<path d="M24 10 L30 0 L36 8 L40 -2 L44 8 L50 0 L56 10 Z" fill-opacity="0"/>' : ""}
  <line x1="40" y1="14" x2="40" y2="5"/>
  <circle class="bulb" cx="40" cy="4" r="4" fill-opacity="1"/>
  <rect x="14" y="14" width="52" height="40" rx="16"/>
  <rect x="21" y="22" width="38" height="24" rx="10" fill="#031a0b" fill-opacity="1" stroke-width="2"/>
  <ellipse class="eye" cx="32" cy="34" rx="4" ry="5" fill-opacity="1" stroke="none"/>
  <ellipse class="eye" cx="48" cy="34" rx="4" ry="5" fill-opacity="1" stroke="none"/>
  <rect class="arm-l" x="8" y="58" width="9" height="20" rx="4.5"/>
  <rect class="arm-r" x="63" y="58" width="9" height="20" rx="4.5"/>
  <rect class="leg-l" x="27" y="78" width="9" height="16" rx="4" fill-opacity=".5"/>
  <rect class="leg-r" x="44" y="78" width="9" height="16" rx="4" fill-opacity=".5"/>
  <rect x="18" y="54" width="44" height="28" rx="12"/>
  <circle cx="40" cy="67" r="5" fill-opacity=".6"/>
</svg>`;
document.querySelector("#boss .bot").innerHTML = botSvg(true);

const $ = s => document.querySelector(s);
const esc = s => String(s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const hhmm = t => new Date(t * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const ago = t => { const s = Math.max(0, Date.now() / 1000 - t | 0); return s < 60 ? s + "s" : s < 3600 ? (s / 60 | 0) + "m" : (s / 3600 | 0) + "h"; };
let proj = null, prev = null, data = { tasks: [], live: [] };
const desks = {}; // role -> element (current project)
const busy = new WeakMap(); // desk -> promise chain so walks queue up instead of overlapping

function desk(role) {
  if (desks[role]) return desks[role];
  const el = document.createElement("div");
  el.className = "desk idle";
  el.innerHTML = `<div class="bubble"></div><span class="zzz">z</span><div class="bot"><div class="fig helm"></div><span class="paper">📄</span></div>
    <div class="table"></div><div class="name">${esc(role)}</div><div class="meta"></div>`;
  el.onclick = () => { want = proj + "-" + role; view("term"); };   // click a bot → its terminal
  $("#desks").append(el);
  return desks[role] = el;
}

// worker walks to Claude's desk and back; `carry` = holding the paper on the way there (true) or back (false)
function walk(el, carryThere) {
  const run = async () => {
    const bot = el.querySelector(".bot"), a = bot.getBoundingClientRect(), b = $("#boss .bot").getBoundingClientRect();
    const dx = b.right + 10 - a.left, dy = b.top + (b.height - a.height) - a.top;
    const go = (from, to) => bot.animate([{ transform: from }, { transform: to }],
      { duration: Math.min(2400, 600 + Math.hypot(dx, dy) * 2.2), easing: "ease-in-out", fill: "forwards" }).finished;
    el.dataset.walk = 1;
    el.classList.add("walking"); el.classList.toggle("carrying", carryThere);
    await go("translate(0,0)", `translate(${dx}px,${dy}px)`);
    el.classList.remove("walking"); el.classList.toggle("carrying", !carryThere);
    await new Promise(r => setTimeout(r, 700));
    el.classList.add("walking");
    await go(`translate(${dx}px,${dy}px)`, "translate(0,0)");
    el.classList.remove("walking", "carrying");
    delete el.dataset.walk;
    bot.getAnimations().forEach(x => x.cancel());
  };
  const p = (busy.get(el) || Promise.resolve()).then(run);
  busy.set(el, p);
  return p;
}

function boss(text, ms = 3500) {
  const b = $("#boss .bubble");
  b.innerHTML = text && `<span>&gt; ${text}</span>`;
  clearTimeout(boss.t);
  boss.t = ms ? setTimeout(() => { boss.t = null; renderBossIdle(); }, ms) : null;
}
function renderBossIdle() {
  const ts = data.tasks.filter(t => t.proj === proj), w = ts.filter(t => t.status === "working").length;
  $("#boss").className = "desk boss " + (w ? "working" : "idle");
  boss(w ? `AWAITING ${w} UNIT${w > 1 ? "S" : ""}...` : ts.length ? "ALL UNITS STANDING BY" : "", 0);
}

function feed(text, t) {
  const li = document.createElement("li");
  li.innerHTML = `<time>[${hhmm(t)}]</time>${text}`;
  $("#feed").prepend(li);
}
const tag = r => `<span class="tag">${esc(r)}</span>`;

function render(animate) {
  const ts = data.tasks.filter(t => t.proj === proj);
  const byRole = {};
  for (const t of ts) byRole[t.seat] = t; // tasks are sorted by start; last one per desk wins
  if (!ts.length) $("#desks").innerHTML = '<div class="empty">&gt; NO TASKS ON RECORD</div>';
  else $("#desks .empty")?.remove();
  for (const [role, t] of Object.entries(byRole)) {
    const el = desk(role);
    if (el.dataset.walk) continue;
    const recentDone = t.status === "done" && Date.now() / 1000 - t.end < 20;
    el.className = "desk " + (t.status === "working" ? "working" : t.status === "stale" ? "stale" : recentDone ? "cheer" : "idle");
    const msg = t.status === "working" ? esc(t.title || t.summary)
      : t.status === "stale" ? "<b>[!] ABANDONED:</b> " + esc(t.title) : t.status === "done" && recentDone ? "[OK] TASK COMPLETE" : "";
    el.querySelector(".bubble").innerHTML = msg && `<span>&gt; ${msg}${t.status === "working" ? '<i class="cur">▮</i>' : ""}</span>`;
    el.querySelector(".bubble").title = t.title || t.summary;
    el.querySelector(".meta").textContent = t.status === "working" ? "T+" + ago(t.start) : t.end ? "DONE " + ago(t.end) + " AGO" : "";
  }
  if (!boss.t) renderBossIdle();
  if (!animate || !prev) return;
  const old = Object.fromEntries(prev.map(t => [t.id, t]));
  for (const t of ts) {
    const o = old[t.id], el = desk(t.seat);
    if (!o) {
      boss(`ASSIGNED <b>${esc(t.seat.toUpperCase())}</b>: ${esc((t.title || "").slice(0, 70))}`);
      feed(`<span class="ov">OVERSEER</span> → ${tag(t.seat)} ${esc(t.title)}`, t.start);
      walk(el, false).then(() => render(false));
    } else if (o.status !== "done" && t.status === "done") {
      boss(`<b>${esc(t.seat.toUpperCase())}</b> REPORTING IN. REVIEWING DIFF...`);
      feed(`${tag(t.seat)} ✔ ${esc(t.summary || t.title)}`, t.end);
      walk(el, true).then(() => render(false));
    }
  }
}

function tabs() {
  const projs = [...new Set(data.tasks.map(t => t.proj))];
  const last = p => Math.max(...data.tasks.filter(t => t.proj === p).map(t => t.end || t.start));
  projs.sort((a, b) => last(b) - last(a));
  if (!proj || !projs.includes(proj)) proj = projs[0];
  $("#tabs").innerHTML = projs.map(p => `<button data-p="${esc(p)}" class="${p === proj ? "on" : ""}">${esc(p)}${
    data.tasks.some(t => t.proj === p && t.status === "working") ? '<span class="dot">●</span>' : ""}</button>`).join("");
  $("#sub").textContent = `${data.live.length} UNITS ONLINE · ${data.tasks.filter(t => t.status === "working").length} ACTIVE`;
  const ts = data.tasks.filter(t => t.proj === proj), n = ts.length, done = ts.filter(t => t.status === "done").length;
  $("#stats").innerHTML = `<span>TASKS ${n}</span><span>DONE ${done}/${n}<span class="bar"><i style="--p:${n ? done / n * 100 : 0}%"></i></span></span>` +
    `<span class="a">ACTIVE ${ts.filter(t => t.status === "working").length}</span><span class="r">STALE ${ts.filter(t => t.status === "stale").length}</span>`;
}
$("#tabs").onclick = e => {
  const p = e.target.closest("button")?.dataset.p;
  if (!p || p === proj) return;
  proj = p; prev = null;
  for (const k in desks) delete desks[k];
  $("#desks").innerHTML = ""; $("#feed").innerHTML = "";
  backfill(); tabs(); render(false);
};
function backfill() { // history for the feed, oldest first so newest ends on top
  for (const t of data.tasks.filter(t => t.proj === proj).slice(-15)) {
    feed(`<span class="ov">OVERSEER</span> → ${tag(t.seat)} ${esc(t.title || t.summary)}`, t.start);
    if (t.end) feed(`${tag(t.seat)} ✔ ${esc(t.summary || t.title)}`, t.end);
  }
}

/* terminal view: polls /term for the selected tagged tmux pane */
let want = null, cur = null;
function view(v) {
  $("aside").classList.toggle("term", v === "term");
  document.querySelectorAll(".sub button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  if (v === "term") { panes(); pollTerm(); }
}
$(".sub").onclick = e => { const v = e.target.dataset.v; if (v) view(v); };
$("#pane").onchange = e => { want = e.target.value; pollTerm(); };
function panes() {
  const tags = (data.panes || []).filter(t => t.startsWith(proj + "-"));
  if (want && !tags.includes(want)) tags.unshift(want);               // keep a clicked-but-closed worker visible
  if (!want || !tags.includes(want)) want = tags[0] || null;
  $("#pane").innerHTML = tags.map(t => `<option ${t === want ? "selected" : ""}>${esc(t)}</option>`).join("") || "<option>(no workers)</option>";
}
async function pollTerm() {
  if (!$("aside").classList.contains("term") || !want) return;
  try {
    const r = await (await fetch("/term?tag=" + encodeURIComponent(want))).json(), out = $("#out");
    const text = r.text == null ? `(pane ${want} is closed or missing)` : r.text || "(empty)";
    if (text !== cur || r.tag !== out.dataset.tag) {
      const stick = out.scrollTop + out.clientHeight >= out.scrollHeight - 30 || r.tag !== out.dataset.tag;
      out.textContent = cur = text; out.dataset.tag = r.tag;
      if (stick) out.scrollTop = out.scrollHeight;
    }
  } catch (e) {}
}
setInterval(pollTerm, 1000);

async function tick() {
  try {
    data = await (await fetch("/state")).json();
    $("#err").textContent = "";
    const first = !proj;
    tabs(); if ($("aside").classList.contains("term")) panes();
    if (first) backfill();
    render(true);
    prev = data.tasks.filter(t => t.proj === proj);
  } catch (e) { $("#err").textContent = "[LINK DOWN]"; }
}
tick(); setInterval(tick, 2000);

/* cursor = whip: rigid handle held at 45°, verlet lash of fixed-length links with bending stiffness.
   #cur toggles it (remembered per browser); off = normal cursor and no animation loop. Off by default for reduced motion. */
{
  const cv = Object.assign(document.createElement("canvas"), { id: "whip" }), cx = cv.getContext("2d");
  document.body.append(cv);
  let on = !matchMedia("(prefers-reduced-motion: reduce)").matches, running = false;
  try { const v = localStorage.getItem("whip"); if (v) on = v === "1"; } catch (e) {}
  const setOn = v => {
    on = v; document.documentElement.classList.toggle("whipped", on); cv.hidden = !on;
    $("#cur").textContent = on ? "CURSOR: WHIP" : "CURSOR: NORMAL";
    try { localStorage.setItem("whip", on ? "1" : "0"); } catch (e) {}
    if (on && !running) { running = true; mx = -99; requestAnimationFrame(frame); }
  };
  $("#cur").onclick = () => setOn(!on);
  const N = 24, L = 9, G = 0.35, HANDLE = 38, BEND = 0.3,                // BEND: 0 = rope, 1 = stiff rod
    DX = Math.SQRT1_2, DY = -Math.SQRT1_2,                               // handle direction: 45° up-right from the hand
    pts = Array.from({ length: N }, () => ({ x: -99, y: -99, px: -99, py: -99 }));
  let mx = -99, my = -99, ac = null, lastCrack = 0;
  const fx = [];   // {x, y, t, txt, col, rays}: CRACK!/damage pops, fade over 600ms
  addEventListener("pointerdown", () => { ac ||= new AudioContext(); }, { once: true });   // audio needs a user gesture
  const snap = () => {   // 60ms white-noise pop, fast decay
    if (!ac) return;
    const n = ac.sampleRate * .06, buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n) ** 4;
    const src = ac.createBufferSource(), g = ac.createGain(); g.gain.value = .5;
    src.buffer = buf; src.connect(g).connect(ac.destination); src.start();
  };
  const hit = (x, y, now) => {   // crack landed on a bot: shake it red + damage number
    for (const bot of document.querySelectorAll(".bot")) {
      const r = bot.getBoundingClientRect();
      if (x < r.left - 12 || x > r.right + 12 || y < r.top - 12 || y > r.bottom + 12) continue;
      bot.classList.remove("hit"); void bot.offsetWidth; bot.classList.add("hit");
      clearTimeout(bot.hitT); bot.hitT = setTimeout(() => bot.classList.remove("hit"), 650);
      fx.push({ x: r.left + r.width / 2, y: r.top, t: now, txt: "-" + (5 + Math.random() * 20 | 0) + " HP", col: "#ff5b3b" });
    }
  };
  const fit = () => { const d = devicePixelRatio || 1; cv.width = innerWidth * d; cv.height = innerHeight * d; cx.setTransform(d, 0, 0, d, 0, 0); };
  fit(); addEventListener("resize", fit);
  addEventListener("pointermove", e => {
    if (mx < -90) pts.forEach((p, i) => { p.x = p.px = e.clientX + DX * (HANDLE + i * L); p.y = p.py = e.clientY + DY * HANDLE + i * L; });
    mx = e.clientX; my = e.clientY;
  });
  const push = (a, b, target, k, pinA) => {   // move a/b toward distance `target`; pinA: a is fixed
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1e-3, f = (d - target) / d * k;
    if (pinA) { b.x -= dx * f; b.y -= dy * f; } else { a.x += dx * f / 2; a.y += dy * f / 2; b.x -= dx * f / 2; b.y -= dy * f / 2; }
  };
  function frame() {
    if (!on) { running = false; cx.clearRect(0, 0, innerWidth, innerHeight); return; }
    const t = pts[N - 1];   // at rest (no fx, mouse still, tip not moving): skip the redraw
    if (!fx.length && mx === frame.mx && my === frame.my && Math.hypot(t.x - t.px, t.y - t.py) < .05) return requestAnimationFrame(frame);
    frame.mx = mx; frame.my = my;
    for (const p of pts.slice(2)) { const vx = (p.x - p.px) * .985, vy = (p.y - p.py) * .985; p.px = p.x; p.py = p.y; p.x += vx; p.y += vy + G; }
    const hx = mx + DX * HANDLE, hy = my + DY * HANDLE;   // handle tip; first lash link continues the handle straight
    for (const [i, o] of [[0, 0], [1, L]]) { const p = pts[i]; p.px = p.x; p.py = p.y; p.x = hx + DX * o; p.y = hy + DY * o; }
    for (let k = 0; k < 12; k++) for (let i = 1; i < N - 1; i++) {
      push(pts[i], pts[i + 1], L, 1, i === 1);                                      // rigid links
      if (i < N - 2) { const c = pts[i + 2], d = Math.hypot(c.x - pts[i].x, c.y - pts[i].y);
        if (d < 2 * L * .97) push(pts[i], c, 2 * L * .97, BEND, i <= 1); }          // resist bending
    }
    const tip = pts[N - 1], now = performance.now();
    if (Math.hypot(tip.x - tip.px, tip.y - tip.py) > 40 && now - lastCrack > 350) {   // tip speed px/frame
      lastCrack = now; fx.push({ x: tip.x, y: tip.y, t: now, txt: "CRACK!", col: "#ffc23a", rays: 1 }); snap(); hit(tip.x, tip.y, now);
    }
    cx.clearRect(0, 0, innerWidth, innerHeight);
    for (const c of fx) {
      const k = (now - c.t) / 600;
      cx.globalAlpha = 1 - k; cx.strokeStyle = cx.fillStyle = cx.shadowColor = c.col; cx.shadowBlur = 12; cx.lineWidth = 2;
      if (c.rays) for (let j = 0; j < 8; j++) {   // burst rays
        const an = j * Math.PI / 4, r0 = 6 + 20 * k, r1 = 14 + 34 * k;
        cx.beginPath(); cx.moveTo(c.x + Math.cos(an) * r0, c.y + Math.sin(an) * r0); cx.lineTo(c.x + Math.cos(an) * r1, c.y + Math.sin(an) * r1); cx.stroke();
      }
      cx.font = `${28 + 14 * k}px VT323, monospace`; cx.textAlign = "center"; cx.fillText(c.txt, c.x, c.y - 26 - 24 * k);
    }
    cx.globalAlpha = 1;
    while (fx.length && now - fx[0].t > 600) fx.shift();
    cx.lineCap = "round"; cx.shadowBlur = 8;
    cx.strokeStyle = cx.shadowColor = "#ffc23a";                    // handle: thick rigid stick + pommel at the hand
    cx.lineWidth = 8; cx.beginPath(); cx.moveTo(mx, my); cx.lineTo(hx, hy); cx.stroke();
    cx.fillStyle = "#ffc23a"; cx.beginPath(); cx.arc(mx, my, 5, 0, 7); cx.fill();
    cx.shadowBlur = 0; cx.strokeStyle = "#2bff88";                 // no blur on the lash: shadowBlur per segment is what lags
    for (let i = 0; i < N - 1; i++) {
      cx.beginPath(); cx.moveTo(pts[i].x, pts[i].y); cx.lineTo(pts[i + 1].x, pts[i + 1].y);
      cx.lineWidth = 5 - 4 * i / N; cx.stroke();
    }
    requestAnimationFrame(frame);
  }
  setOn(on);
}
</script>
